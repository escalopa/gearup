# gearup tmux.conf — tuned for a workspace-per-project workflow.

# ---- basics ------------------------------------------------------------------
unbind C-b
set -g prefix C-a                 # easier to hit than C-b
bind C-a send-prefix              # press C-a twice to send a literal C-a

set -g mouse on
set -g base-index 1               # windows start at 1 (matches keyboard row)
setw -g pane-base-index 1
set -g renumber-windows on        # no gaps after closing windows
set -g history-limit 100000
set -sg escape-time 10            # snappy Esc in nvim
set -g focus-events on            # let nvim notice focus changes
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"   # true color

# ---- keybindings -------------------------------------------------------------
# splits that make visual sense, opening in the current path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# THE key binding: prefix + g pops up the workspace switcher.
# Pick a project -> you're in its own session. C-a L toggles last session.
bind g display-popup -E -w 70% -h 60% "ws"
bind L switch-client -l

# reload config
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# vi everywhere
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# resize panes with prefix + H/J/K/L (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ---- status line ---------------------------------------------------------------
set -g status-position top
set -g status-style "bg=#1a1b26,fg=#a9b1d6"
set -g status-left-length 30
set -g status-left "#[bold,fg=#7aa2f7] #S #[default]│ "
set -g status-right "#[fg=#565f89]%H:%M "
setw -g window-status-current-format "#[bold,fg=#c0caf5]#I:#W#[default]"
setw -g window-status-format "#[fg=#565f89]#I:#W"

# ---- plugins (managed by TPM; installed by gearup automatically) ----------------
# prefix + I  install new plugins        prefix + U  update plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'        # community-agreed sane defaults
set -g @plugin 'christoomey/vim-tmux-navigator'    # Ctrl-hjkl across panes AND nvim splits
set -g @plugin 'tmux-plugins/tmux-yank'            # copy-mode yank -> system clipboard
set -g @plugin 'tmux-plugins/tmux-resurrect'       # save/restore sessions across reboots
set -g @plugin 'tmux-plugins/tmux-continuum'       # ...automatically, every 15 min

set -g @resurrect-strategy-nvim 'session'          # restore nvim sessions too
set -g @continuum-restore 'on'                     # restore on tmux start

# initialize TPM (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
