# gearup starship prompt — tuned for backend/devops work.
# Symlinked to ~/.config/starship.toml; edit the repo copy to change every machine.
# Docs: https://starship.rs/config/

add_newline = true
command_timeout = 800

format = """
$directory\
$git_branch$git_status\
$golang$kubernetes$aws$terraform$docker_context\
$cmd_duration\
$line_break$character"""

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold cyan"

[git_branch]
symbol = " "
style = "bold purple"

[git_status]
style = "bold yellow"

[cmd_duration]
min_time = 2000
format = "[ $duration]($style) "
style = "bold yellow"

[golang]
symbol = " "
format = "[$symbol($version )]($style)"
style = "bold cyan"

# Kubernetes context is off by default in starship — enable it, it's invaluable
# to see which cluster you're pointed at before running a command.
[kubernetes]
disabled = false
symbol = "☸ "
format = '[$symbol$context( \($namespace\))]($style) '
style = "bold blue"

[aws]
symbol = " "
format = '[$symbol($profile )(\($region\) )]($style)'
style = "bold yellow"

[terraform]
symbol = "󱁢 "
format = '[$symbol$workspace]($style) '
style = "bold purple"

[docker_context]
symbol = " "
format = "[$symbol$context]($style) "
style = "bold blue"
